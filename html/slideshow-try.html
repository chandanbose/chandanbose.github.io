<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slideshow Demo</title>
  <style>
    body {
      margin: 0;
      display: grid;
      place-items: center;
      height: 100vh;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .slideshow {
      width: 800px;
      height: 450px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .slide.active {
      opacity: 1;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2b2b2b;
      color: white;
    }

    button:hover {
      background: #444;
    }
  </style>
</head>
<body>

  <div class="slideshow">
    <div class="slide active">
      <img src="https://picsum.photos/id/1015/1200/800">
    </div>
    <div class="slide">
      <img src="https://picsum.photos/id/1016/1200/800">
    </div>
    <div class="slide">
      <img src="https://picsum.photos/id/1018/1200/800">
    </div>
  </div>

  <div class="controls">
    <button onclick="prev()">Prev</button>
    <button onclick="next()">Next</button>
  </div>

  <script>
    const slides = document.querySelectorAll(".slide");
    let index = 0;

    function showSlide(i) {
      slides.forEach(s => s.classList.remove("active"));
      slides[i].classList.add("active");
    }

    function next() {
      index = (index + 1) % slides.length;
      showSlide(index);
    }

    function prev() {
      index = (index - 1 + slides.length) % slides.length;
      showSlide(index);
    }

    // Optional autoplay
    setInterval(next, 3000);
  </script>

</body>
</html>
